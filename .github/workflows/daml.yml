name: Daml

# Build both packages and run every Daml Script scenario twice: on the IDE
# ledger (fast, with a coverage gate) and on a real Canton sandbox participant
# over the Ledger API. The SDK comes from the official Docker image pinned by
# digest (3.4 stable is only published through dpm).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daml-${{ github.ref }}
  cancel-in-progress: true

env:
  # digitalasset/daml-sdk:3.4.0-rc2
  DAML_IMAGE: digitalasset/daml-sdk@sha256:a01ad67343b07e9281ac1b99b791c6dc92337e85b2d4bd9e4f392421c2b4613a

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the Daml SDK image
        run: docker pull "$DAML_IMAGE"

      - name: Build and test
        run: scripts/daml-test.sh

      # The full mutation run takes ~20 minutes; CI only checks that every
      # mutant still applies, so the list cannot rot as the code changes.
      - name: Mutation list is current
        run: python3 scripts/mutation_test.py --check

  canton:
    name: scenarios on a Canton participant
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the Daml SDK image
        run: docker pull "$DAML_IMAGE"

      - name: Run every scenario against a Canton sandbox
        run: scripts/canton-test.sh

  app:
    name: JSON Ledger API app on a Canton participant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Pull the Daml SDK image
        run: docker pull "$DAML_IMAGE"

      - name: Run the app end to end
        run: scripts/app-test.sh

      - name: Keep the regulator's page
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regulator-view
          path: app/out/
          if-no-files-found: ignore
